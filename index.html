<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access · Your Company Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:           #f6f7f9;
      --surface:      #ffffff;
      --surface-2:    #f1f2f4;
      --border:       rgba(0,0,0,0.08);
      --border-focus: rgba(220,38,38,0.5);
      --fg:           #121212;
      --muted:        #6b7280;
      --muted-2:      #9ca3af;
      --primary:      #dc2626;
      --primary-h:    #b91c1c;
      --ring:         rgba(220,38,38,0.25);
      --radius:       14px;
      --radius-sm:    9px;
      --font-display: 'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --green: #22c55e;
      --red:   #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    canvas#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5; }

    .page { position: relative; z-index: 1; display: flex; align-items: stretch; min-height: 100vh; }

    .brand { display: none; flex: 1; flex-direction: column; justify-content: space-between; padding: 3.5rem 4rem; border-right: 1px solid var(--border); }
    @media (min-width: 900px) { .brand { display: flex; } }
    .brand-logo { display: flex; align-items: center; gap: 0.625rem; }
    .brand-logo .mark { width: 34px; height: 34px; background: var(--primary); border-radius: 8px; display: grid; place-items: center; }
    .brand-logo .wordmark { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; }
    .brand-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 3rem; }
    .brand-headline { font-family: var(--font-display); font-size: clamp(2.25rem, 3.5vw, 3.25rem); font-weight: 800; line-height: 1.05; }
    .brand-headline em { font-style: normal; color: var(--primary); }
    .brand-sub { margin-top: 1.25rem; font-size: 1rem; color: var(--muted); max-width: 28rem; }
    .brand-footer { font-size: 0.6875rem; color: var(--muted-2); letter-spacing: 0.12em; text-transform: uppercase; }

    .panel { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; }
    @media (min-width: 900px) { .panel { width: 480px; padding: 3rem; } }
    .panel-inner { width: 100%; max-width: 380px; animation: fade-up 0.4s ease both; }

    .panel-title { font-family: var(--font-display); font-size: 1.625rem; font-weight: 800; letter-spacing: -0.025em; }
    .panel-sub { margin-top: 0.375rem; margin-bottom: 2rem; font-size: 0.875rem; color: var(--muted); }

    .field { margin-bottom: 0.875rem; }
    .field label { display: block; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
    .field input {
      width: 100%; height: 2.875rem; padding: 0 1rem; font-family: var(--font-body); font-size: 0.9375rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; color: var(--fg);
    }
    .field input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--ring); }

    .btn-submit {
      width: 100%; height: 3rem; margin-top: 1rem; background: var(--primary); color: #fff; font-weight: 600;
      border: none; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s;
      font-family: var(--font-body); font-size: 0.9375rem;
    }
    .btn-submit:hover:not(:disabled) { background: var(--primary-h); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .notify {
      min-height: 1.4rem; font-size: .85rem; text-align: center;
      color: var(--muted); margin-top: .75rem; opacity: 0; transition: opacity .2s;
    }
    .notify.ok  { opacity: 1; color: var(--green); }
    .notify.err { opacity: 1; color: var(--red); }

    .toggle-row { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--muted); }
    .toggle-row button { background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; font-family: var(--font-body); }

    .powered { margin-top: 2.5rem; text-align: center; font-size: 0.625rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); }

    .modal-backdrop { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 360px; }
    .modal h3 { font-family: var(--font-display); margin-bottom: 0.5rem; }
    .modal p { font-size: 0.875rem; color: var(--muted); margin-bottom: 1.5rem; }

    .btn-secondary {
      width: 100%; height: 3rem; margin-top: 0.5rem; background: var(--surface-2); color: var(--muted);
      border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-body);
      font-size: 0.9375rem; font-weight: 600; transition: background 0.15s;
    }
    .btn-secondary:hover { background: var(--border); }

    @keyframes fade-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="page">
  <div class="brand">
    <div class="brand-logo">
      <div class="mark"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="white"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="white"/></svg></div>
      <span class="wordmark">Your Company Name</span>
    </div>
    <div class="brand-body">
      <h1 class="brand-headline">Your App,<br><em>Your Data.</em></h1>
      <p class="brand-sub">Your tagline goes here.</p>
    </div>
    <p class="brand-footer">Powered by GnokeSuite © 2026</p>
  </div>

  <div class="panel">
    <div class="panel-inner">
      <h2 class="panel-title" id="mode-title">Sign In</h2>
      <p class="panel-sub" id="mode-sub">Access your account</p>

      <form id="auth-form" onsubmit="Auth.submit(event)">

        <div id="reg-fields" style="display:none">
          <div class="field">
            <label>Full Name *</label>
            <input type="text" id="field-name" placeholder="Your name">
          </div>
          <div class="field">
            <label>Phone Number *</label>
            <input type="tel" id="field-phone" placeholder="080...">
          </div>
          <div class="field">
            <label>Email Address *</label>
            <input type="email" id="field-email" placeholder="you@example.com">
          </div>
        </div>

        <div class="field" id="login-field">
          <label>Phone or Email *</label>
          <input type="text" id="field-id" placeholder="080... or you@example.com" autocomplete="username">
        </div>

        <div class="field">
          <label id="pin-label">PIN *</label>
          <input type="password" id="field-pin" placeholder="••••" required>
        </div>

        <div class="field" id="field-confirm" style="display:none">
          <label>Confirm PIN *</label>
          <input type="password" id="field-pin-confirm" placeholder="••••">
        </div>

        <div class="field" id="field-auth" style="display:none">
          <label>Authorization Code *</label>
          <input type="text" id="field-auth-code" placeholder="Provided by admin">
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Sign In</button>
      </form>

      <div class="notify" id="notify"></div>

      <div class="toggle-row">
        <span id="toggle-text">New here?&nbsp;</span>
        <button id="toggle-btn" onclick="Auth.toggleMode()">Create Account</button>
      </div>

      <div class="toggle-row" style="margin-top:0.5rem">
        <button style="color:var(--muted); font-weight:400; font-size:0.8125rem" onclick="Auth.openRestore()">♻️ Restore Account</button>
      </div>

      <p class="powered">Powered by GnokeSuite © 2026</p>
    </div>
  </div>
</div>

<!-- OTP Restore Modal -->
<div class="modal-backdrop" id="otp-modal">
  <div class="modal">
    <h3>Restore Account</h3>
    <p>Enter your phone or email, the OTP code your admin sent you, and choose a new PIN for this device.</p>
    <div class="field">
      <label>Phone or Email *</label>
      <input type="text" id="restore-id" placeholder="080... or you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>OTP Code *</label>
      <input type="text" id="restore-code" placeholder="e.g. A1B2C3D4" maxlength="8"
             style="text-transform:uppercase; letter-spacing:.15em;" autocomplete="off">
    </div>
    <div class="field">
      <label>New PIN *</label>
      <input type="password" id="restore-pin" placeholder="••••••" autocomplete="new-password">
    </div>
    <button class="btn-submit" id="restore-submit" onclick="Auth.redeemOtp()">Restore Access</button>
    <button class="btn-secondary" onclick="Auth.closeRestore()">Cancel</button>
    <div class="notify" id="restore-notify"></div>
  </div>
</div>

  <script src="scripts/connect.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
